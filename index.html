<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Khoud-7wayji | Boutique d'Échange & Seconde Main</title>

<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=Inter:wght@300;400;600;800&display=swap');

:root {
--balna-bg: #fdfdfb;
--balna-accent: #0d0d0d;
--balna-border: #e8e8e3;
}

body {
font-family: 'Inter', sans-serif;
background-color: var(--balna-bg);
color: var(--balna-accent);
overflow-x: hidden;
}

.modal {
display: none;
position: fixed;
inset: 0;
background: rgba(255,255,255,0.98);
z-index: 1000;
backdrop-filter: blur(10px);
}

.input-balna {
border-bottom: 1px solid var(--balna-border);
padding: 1rem 0;
width: 100%;
outline: none;
background: transparent;
}

.upload-zone {
border: 1px dashed var(--balna-border);
height: 300px;
display:flex;
align-items:center;
justify-content:center;
cursor:pointer;
position:relative;
overflow:hidden;
transition:0.4s;
}

.upload-zone:hover {
border-color:black;
}

.preview-img {
position:absolute;
inset:0;
width:100%;
height:100%;
object-fit:cover;
}

.btn-black {
background:black;
color:white;
padding:15px 40px;
font-size:11px;
letter-spacing:0.2em;
text-transform:uppercase;
transition:0.3s;
}

.btn-black:hover {
background:transparent;
color:black;
border:1px solid black;
}
</style>
</head>

<body>

<!-- NAVIGATION -->
<nav class="sticky top-0 bg-white border-b z-50">
<div class="max-w-7xl mx-auto px-8 flex justify-between items-center h-24">

<div class="flex items-center space-x-6">
<img src="assets/logo-marque.jpg" alt="Logo" class="h-12 object-contain">
</div>

<div class="space-x-8 text-xs uppercase tracking-widest font-bold">
<a href="https://www.instagram.com/khoud_7wayji/" target="_blank">Instagram</a>
<button onclick="openModal('profileModal')">Vendre</button>
<button onclick="openModal('signupModal')" class="btn-black">S'inscrire</button>
</div>

</div>
</nav>

<!-- HERO -->
<header class="py-32 text-center">
<h1 class="text-6xl italic mb-6">No cash? No drama.</h1>
<p class="italic text-2xl mb-4">Khoud l-style, flex l-vibe</p>
</header>

<!-- MAIN -->
<main class="max-w-7xl mx-auto px-8 py-20 text-center">
<p class="text-gray-400 italic text-3xl">Le futur de votre style commence ici.</p>
</main>

<!-- MODAL VENDRE -->
<div id="profileModal" class="modal flex items-center justify-center p-8">
<div class="bg-white w-full max-w-4xl p-16 relative border">

<button onclick="closeModal('profileModal')" class="absolute right-8 top-8 text-3xl">&times;</button>

<h2 class="text-4xl mb-10 italic">Vendre</h2>

<div id="uploadZone" class="upload-zone" onclick="document.getElementById('imageInput').click()">

<input type="file" id="imageInput" accept="image/*" class="hidden" onchange="previewImage(event)">

<div id="uploadText" class="text-center uppercase text-xs tracking-widest">
Importer une image
</div>

<img id="preview" class="preview-img hidden">

</div>

<div class="grid grid-cols-2 gap-10 mt-12">
<input type="text" placeholder="Nom de l'article" class="input-balna">
<input type="number" placeholder="Prix (MAD)" class="input-balna">
</div>

<button class="btn-black mt-12 w-full" onclick="showAlert('Article en vérification')">
Confirmer le dépôt
</button>

</div>
</div>

<!-- MODAL INSCRIPTION -->
<div id="signupModal" class="modal flex items-center justify-center p-8">
<div class="bg-white w-full max-w-xl p-16 relative border">

<button onclick="closeModal('signupModal')" class="absolute right-8 top-8 text-3xl">&times;</button>

<h2 class="text-4xl italic mb-10">Rejoindre</h2>

<form onsubmit="handleRegistration(event)" class="space-y-8">

<input type="text" placeholder="Nom Complet" required class="input-balna">

<input type="date" id="birthDate" required class="input-balna" onchange="checkAge()">

<input type="email" placeholder="Email" required class="input-balna">

<input type="tel" placeholder="Téléphone" required class="input-balna">

<div id="cinSection" class="hidden">
<p class="text-xs mb-4 uppercase tracking-widest">Vérification CIN obligatoire</p>
<button type="button" onclick="verifyCIN()" class="btn-black w-full">Scanner CIN</button>
<input type="hidden" id="cinStatus" value="false">
</div>

<button type="submit" class="btn-black w-full">Créer mon profil</button>

</form>

</div>
</div>

<!-- ALERT -->
<div id="alertBox" class="fixed bottom-10 left-1/2 -translate-x-1/2 opacity-0 transition-all">
<div class="bg-black text-white px-12 py-4 uppercase tracking-widest text-xs">
<span id="alertText"></span>
</div>
</div>

<script>

function openModal(id){
document.getElementById(id).style.display="flex";
document.body.style.overflow="hidden";
}

function closeModal(id){
document.getElementById(id).style.display="none";
document.body.style.overflow="auto";
}

function previewImage(event){
const file=event.target.files[0];
if(!file) return;

const reader=new FileReader();
reader.onload=function(e){
document.getElementById('preview').src=e.target.result;
document.getElementById('preview').classList.remove('hidden');
document.getElementById('uploadText').classList.add('hidden');
}
reader.readAsDataURL(file);
}

function checkAge(){
const birth=document.getElementById('birthDate').value;
if(!birth) return;

const today=new Date();
const birthDate=new Date(birth);
let age=today.getFullYear()-birthDate.getFullYear();
const m=today.getMonth()-birthDate.getMonth();
if(m<0 || (m===0 && today.getDate()<birthDate.getDate())) age--;

if(age>=18){
document.getElementById('cinSection').classList.remove('hidden');
}else{
document.getElementById('cinSection').classList.add('hidden');
}
}

function verifyCIN(){
document.getElementById('cinStatus').value="true";
showAlert("CIN vérifiée");
}

function handleRegistration(e){
e.preventDefault();

const birth=document.getElementById('birthDate').value;
const age=new Date().getFullYear()-new Date(birth).getFullYear();
const cin=document.getElementById('cinStatus').value;

if(age>=18 && cin!=="true"){
showAlert("Vérification CIN requise");
return;
}

showAlert("Bienvenue chez Khoud");
closeModal('signupModal');
}

function showAlert(msg){
const box=document.getElementById('alertBox');
document.getElementById('alertText').textContent=msg;
box.classList.remove('opacity-0');
setTimeout(()=>box.classList.add('opacity-0'),4000);
}

window.onclick=function(e){
if(e.target.classList.contains('modal')){
closeModal(e.target.id);
}
}

</script>

</body>
</html>
